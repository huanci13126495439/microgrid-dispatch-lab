[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "microgrid-dispatch-lab"
version = "0.1.0"
readme = "README.md"
authors = [{name = "Xie Sentao"}]
license = "MIT"
license-files = ["LICENSE"]
description = "Educational single-day MILP microgrid storage dispatch, simulation, and constraint checks"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "scipy>=1.11"]
classifiers = ["Programming Language :: Python :: 3", "Development Status :: 3 - Alpha", "Topic :: Scientific/Engineering"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
microgrid-dispatch = "microgrid_dispatch.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

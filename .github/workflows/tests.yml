name: Python tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package and test dependencies
        run: python -m pip install -e '.[test]'
      - name: Run unit tests
        run: python -m pytest -q
      - name: Run synthetic demonstration
        run: |
          python examples/generate_synthetic.py
          python -m microgrid_dispatch --input examples/synthetic_day.csv --output-dir outputs/

name: Publish v0.1.1 release

on:
  push:
    paths:
      - ".github/workflows/publish-v0.1.1.yml"

permissions:
  contents: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Create the verified v0.1.1 tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: v0.1.1
          TARGET: 77981a5be2dd89d072de36135a24af8ebdc7ac81
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite it."
            exit 1
          fi

          if gh api "repos/$REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; refusing to publish against an unverified tag."
            exit 1
          fi

          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          ## Changes
          - Improve parameter, CSV, and battery configuration validation.
          - Provide clearer diagnostics for MILP solver termination failures.
          - Improve numerical robustness and reject non-finite or overflowing dispatch costs.
          - Add regression tests and update maintenance documentation.

          ## Verification
          GitHub Actions passed on Windows and Ubuntu with Python 3.11, including dependency installation, unit tests, and the synthetic demonstration.

          ## Limitations
          This is an educational optimization project using synthetic data. Simulated cost differences are not measured real-world savings. The software has not been validated for real-world grid control or physical battery operation.

          Licensed under the MIT License.
          NOTES

          gh release create "$TAG" \
            --repo "$REPOSITORY" \
            --target "$TARGET" \
            --title "v0.1.1 - Maintenance Release" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
